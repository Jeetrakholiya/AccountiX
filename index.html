<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="AccountiX — Executive Agency Operating System & Financial ERP">
<meta name="theme-color" content="#080a10">
<title>AccountiX — Executive Agency Operating System & Financial ERP</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%236366f1'/><text x='50%' y='62%' text-anchor='middle' font-family='sans-serif' font-weight='900' font-size='44' fill='%23ffffff'>AX</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ================= OFFICIAL EXECUTIVE PALETTE & THEME ENGINE ================= */
:root {
  /* Executive Obsidian (Dark Mode - Default) */
  --bg-app: #080a10;
  --bg-sidebar: #0b0f19;
  --bg-card: #121826;
  --bg-card-hover: #182236;
  --bg-elevated: #1a2338;
  --bg-subtle: #0e1422;
  
  --text-primary: #f8fafc;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;
  --text-faint: #475569;
  
  --border-subtle: #1e293b;
  --border-card: #222f46;
  --border-focus: #6366f1;

  /* Official Brand & Accents */
  --brand: #6366f1;               /* Royal Indigo */
  --brand-light: #818cf8;
  --brand-dark: #4f46e5;
  --brand-gradient: linear-gradient(135deg, #6366f1 0%, #4338ca 100%);
  --brand-soft: rgba(99, 102, 241, 0.12);
  --brand-glow: rgba(99, 102, 241, 0.35);

  /* Financial Accents */
  --signal-cash: #10b981;         /* Emerald Green for Realized Cash */
  --signal-cash-glow: rgba(16, 185, 129, 0.28);
  --signal-soft: rgba(16, 185, 129, 0.12);
  --accent-cyan: #06b6d4;         /* Cyber Cyan for Inflows */
  --accent-cyan-soft: rgba(6, 182, 212, 0.12);
  --accent-amber: #f59e0b;        /* Amber Gold for Renewals & Dues */
  --accent-amber-soft: rgba(245, 158, 11, 0.14);
  --accent-rose: #f43f5e;         /* Crimson Rose for Danger / Outflows */
  --accent-rose-soft: rgba(244, 63, 94, 0.12);

  /* Hero & Surface Specifics */
  --hero-bg: linear-gradient(135deg, #0b111e 0%, #151d30 50%, #1e193d 100%);
  --hero-border: rgba(99, 102, 241, 0.25);
  --hero-title-color: #ffffff;
  --hero-sub-color: #94a3b8;
  --hero-stat-text: #94a3b8;
  --hero-stat-val: #ffffff;
  --hero-decor-1: rgba(16, 185, 129, 0.18);
  --hero-decor-2: rgba(99, 102, 241, 0.2);

  --sidebar-hover-bg: rgba(255, 255, 255, 0.06);
  --sidebar-hover-text: #ffffff;
  --overlay-bg: rgba(8, 10, 16, 0.78);
  --toast-bg: #1a2338;
  --toast-text: #ffffff;

  --radius-sm: 8px;
  --radius: 12px;
  --radius-lg: 18px;
  --radius-xl: 24px;

  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
  --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.45);
  --shadow-lg: 0 16px 48px rgba(0, 0, 0, 0.65);
}

/* Complete Official Light Theme */
[data-theme="light"] {
  --bg-app: #f4f6fa;
  --bg-sidebar: #ffffff;          /* Clean white official light sidebar */
  --bg-card: #ffffff;
  --bg-card-hover: #f8fafc;
  --bg-elevated: #ffffff;
  --bg-subtle: #f1f5f9;

  --text-primary: #0f172a;
  --text-secondary: #475569;
  --text-muted: #64748b;
  --text-faint: #94a3b8;

  --border-subtle: #e2e8f0;
  --border-card: #e2e8f0;
  --border-focus: #4f46e5;

  --brand: #4f46e5;
  --brand-light: #4338ca;
  --brand-dark: #3730a3;
  --brand-soft: #eef2ff;
  --brand-glow: rgba(79, 70, 229, 0.15);

  --signal-cash: #059669;
  --signal-cash-glow: rgba(5, 150, 105, 0.15);
  --signal-soft: #ecfdf5;
  --accent-cyan: #0284c7;
  --accent-cyan-soft: #ecfeff;
  --accent-amber: #d97706;
  --accent-amber-soft: #fffbeb;
  --accent-rose: #e11d48;
  --accent-rose-soft: #fff1f2;

  /* Hero & Surface Specifics */
  --hero-bg: linear-gradient(135deg, #ffffff 0%, #f0fdf4 55%, #eef2ff 100%);
  --hero-border: rgba(16, 185, 129, 0.35);
  --hero-title-color: #0f172a;
  --hero-sub-color: #475569;
  --hero-stat-text: #64748b;
  --hero-stat-val: #0f172a;
  --hero-decor-1: rgba(16, 185, 129, 0.12);
  --hero-decor-2: rgba(99, 102, 241, 0.1);

  --sidebar-hover-bg: #f1f5f9;
  --sidebar-hover-text: #0f172a;
  --overlay-bg: rgba(15, 23, 42, 0.45);
  --toast-bg: #0f172a;
  --toast-text: #ffffff;

  --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
  --shadow-md: 0 4px 18px rgba(15, 23, 42, 0.07);
  --shadow-lg: 0 12px 36px rgba(15, 23, 42, 0.12);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  background-color: var(--bg-app);
  color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
  line-height: 1.5;
  transition: background-color 0.2s ease, color 0.2s ease;
}
h1, h2, h3, h4, .display-font { font-family: 'Space Grotesk', sans-serif; letter-spacing: -0.02em; font-weight: 700; color: var(--text-primary); }
.mono { font-family: 'JetBrains Mono', monospace; font-feature-settings: "zero" 1; }
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font-family: inherit; font-size: inherit; }

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-card); border-radius: 99px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

/* ================= APP SHELL LAYOUT ================= */
#app { display: flex; min-height: 100vh; background: var(--bg-app); position: relative; }
.main-content-wrapper { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100vh; overflow-y: auto; }
main { flex: 1; padding: 26px 36px 80px 36px; max-width: 1400px; width: 100%; margin: 0 auto; }

/* Sidebar */
.sidebar {
  width: 255px; background: var(--bg-sidebar); border-right: 1px solid var(--border-subtle);
  color: var(--text-primary); flex-shrink: 0; display: flex; flex-direction: column; padding: 22px 14px;
  position: sticky; top: 0; height: 100vh; z-index: 40; transition: transform 0.25s ease, background 0.2s ease;
}
.brand-badge {
  padding: 0 8px 20px 8px; border-bottom: 1px solid var(--border-subtle); margin-bottom: 18px;
  display: flex; align-items: center; gap: 12px;
}
.brand-icon {
  width: 40px; height: 40px; border-radius: 10px;
  background: var(--brand-gradient); display: flex; align-items: center; justify-content: center;
  color: #fff; font-weight: 800; font-size: 19px; box-shadow: 0 4px 14px var(--brand-glow);
  font-family: 'Space Grotesk'; letter-spacing: -0.05em; flex-shrink: 0;
}
.brand-title { font-size: 18px; font-weight: 800; letter-spacing: 0.2px; color: var(--text-primary); }
.brand-tagline { font-size: 10.5px; color: var(--signal-cash); font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; margin-top: 1px; }

.nav-section { display: flex; flex-direction: column; gap: 3px; flex: 1; }
.nav-item {
  display: flex; align-items: center; gap: 11px; padding: 9px 13px; border-radius: 9px;
  color: var(--text-secondary); font-size: 13.5px; font-weight: 600; cursor: pointer;
  transition: all 0.15s ease; user-select: none; position: relative;
}
.nav-item svg { width: 18px; height: 18px; flex-shrink: 0; color: var(--text-muted); }
.nav-item:hover { background: var(--sidebar-hover-bg); color: var(--sidebar-hover-text); }
.nav-item:hover svg { color: var(--sidebar-hover-text); }
.nav-item.active { background: var(--brand); color: #ffffff; box-shadow: 0 4px 16px var(--brand-glow); }
.nav-item.active svg { color: #ffffff; }
.nav-counter { margin-left: auto; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 99px; background: var(--bg-subtle); color: var(--text-secondary); border: 1px solid var(--border-subtle); }
.nav-item.active .nav-counter { background: rgba(255, 255, 255, 0.25); color: #ffffff; border-color: transparent; }

.sidebar-footer { padding-top: 14px; border-top: 1px solid var(--border-subtle); display: flex; flex-direction: column; gap: 10px; }
.owner-pill { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: var(--bg-subtle); border: 1px solid var(--border-subtle); border-radius: 9px; }
.owner-avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--brand-soft); color: var(--brand); display: flex; align-items: center; justify-content: center; font-size: 11.5px; font-weight: 800; }
.owner-info { font-size: 12px; line-height: 1.2; }
.owner-info b { color: var(--text-primary); }
.owner-info span { color: var(--text-muted); font-size: 10.5px; }

/* Topbar */
.topbar {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 12px 36px; background: var(--bg-card); border-bottom: 1px solid var(--border-subtle);
  position: sticky; top: 0; z-index: 30; backdrop-filter: blur(14px);
}
.topbar-left { display: flex; align-items: center; gap: 16px; flex: 1; }
.pulse-badge {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px;
  border-radius: 99px; background: var(--signal-soft); border: 1px solid rgba(16, 185, 129, 0.25);
  font-size: 11px; font-weight: 700; color: var(--signal-cash); text-transform: uppercase; letter-spacing: 0.4px;
}
.pulse-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--signal-cash); box-shadow: 0 0 8px var(--signal-cash); }

.search-bar {
  display: flex; align-items: center; gap: 10px; background: var(--bg-subtle);
  border: 1px solid var(--border-subtle); border-radius: 9px; padding: 7px 13px;
  width: 100%; max-width: 420px; transition: border-color 0.15s ease, box-shadow 0.15s ease;
}
.search-bar:focus-within { border-color: var(--border-focus); box-shadow: 0 0 0 3px var(--brand-soft); }
.search-bar svg { width: 16px; height: 16px; color: var(--text-muted); flex-shrink: 0; }
.search-bar input { border: none; background: transparent; outline: none; color: var(--text-primary); font-size: 13px; width: 100%; }
.cmd-shortcut { font-size: 10px; font-family: 'JetBrains Mono', monospace; background: var(--bg-card); color: var(--text-muted); padding: 2px 5px; border-radius: 4px; border: 1px solid var(--border-subtle); }
.topbar-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

/* ================= EXECUTIVE PROFILE & ACTIONS DROPDOWN ================= */
.profile-dropdown-wrapper {
  position: relative;
  display: inline-block;
}
.profile-trigger {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 5px 10px;
  border-radius: 9px;
  background: var(--bg-subtle);
  border: 1px solid var(--border-subtle);
  color: var(--text-primary);
  cursor: pointer;
  font-size: 13px;
  font-weight: 700;
  transition: all 0.15s ease;
  user-select: none;
}
.profile-trigger:hover, .profile-trigger.active {
  background: var(--bg-elevated);
  border-color: var(--border-focus);
}
.profile-caret {
  font-size: 8px;
  color: var(--text-muted);
  transition: transform 0.2s ease;
  margin-left: 2px;
}
.profile-trigger.active .profile-caret {
  transform: rotate(180deg);
}

.dropdown-menu {
  position: absolute;
  top: calc(100% + 8px);
  right: 0;
  width: 310px;
  max-width: calc(100vw - 24px);
  background: var(--bg-card);
  border: 1px solid var(--border-card);
  border-radius: 14px;
  box-shadow: var(--shadow-lg), 0 20px 40px rgba(0, 0, 0, 0.45);
  padding: 8px;
  z-index: 150;
  display: none;
  flex-direction: column;
  gap: 3px;
  backdrop-filter: blur(16px);
  animation: dropdownFadeIn 0.15s cubic-bezier(0.16, 1, 0.3, 1);
}
.dropdown-menu.show {
  display: flex;
}

@keyframes dropdownFadeIn {
  from { opacity: 0; transform: translateY(-8px) scale(0.97); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.dropdown-header {
  padding: 12px 14px;
  background: var(--bg-subtle);
  border: 1px solid var(--border-subtle);
  border-radius: 10px;
  margin-bottom: 4px;
}
.dropdown-header-user {
  display: flex;
  align-items: center;
  gap: 10px;
}
.dropdown-header-avatar {
  font-size: 26px;
  line-height: 1;
}
.dropdown-header-name {
  font-weight: 800;
  font-size: 13.5px;
  color: var(--text-primary);
  line-height: 1.2;
}
.dropdown-header-email {
  font-size: 11px;
  color: var(--text-secondary);
  margin-top: 2px;
}

.dropdown-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 12px;
  border-radius: 8px;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--text-primary);
  cursor: pointer;
  transition: all 0.12s ease;
  user-select: none;
}
.dropdown-item:hover {
  background: var(--bg-subtle);
  color: var(--brand-light);
}
.dropdown-item-left {
  display: flex;
  align-items: center;
  gap: 9px;
  text-align: left;
}
.dropdown-divider {
  height: 1px;
  background: var(--border-subtle);
  margin: 4px 6px;
}
.dropdown-item-danger {
  color: var(--accent-rose);
}
.dropdown-item-danger:hover {
  background: var(--accent-rose-soft);
  color: var(--accent-rose);
}

/* Buttons */
.btn {
  border: none; border-radius: 9px; padding: 8px 15px; font-weight: 600; font-size: 13px;
  cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
  gap: 7px; transition: all 0.12s ease; user-select: none;
}
.btn:active { transform: scale(0.97); }
.btn-primary { background: var(--brand-gradient); color: #fff; box-shadow: 0 4px 14px var(--brand-glow); }
.btn-primary:hover { opacity: 0.94; }
.btn-signal { background: var(--signal-cash); color: #ffffff; font-weight: 700; box-shadow: 0 4px 14px var(--signal-cash-glow); }
.btn-signal:hover { opacity: 0.92; }
.btn-ghost { background: var(--bg-subtle); color: var(--text-primary); border: 1px solid var(--border-subtle); }
.btn-ghost:hover { background: var(--bg-elevated); border-color: var(--border-focus); }
.btn-danger-ghost { background: var(--accent-rose-soft); color: var(--accent-rose); border: 1px solid rgba(244, 63, 94, 0.2); }
.btn-danger-ghost:hover { background: var(--accent-rose); color: #fff; }
.btn-sm { padding: 5px 11px; font-size: 12px; border-radius: 7px; }
.btn-icon {
  padding: 8px; border-radius: 9px; background: var(--bg-subtle); border: 1px solid var(--border-subtle);
  color: var(--text-secondary); cursor: pointer; position: relative; display: flex; align-items: center; justify-content: center;
}
.btn-icon:hover { background: var(--bg-elevated); color: var(--text-primary); }
.wa-btn {
  background: #25d366; color: #fff; border: none; border-radius: 7px;
  padding: 6px 12px; font-size: 12px; font-weight: 700; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px; transition: opacity 0.15s ease;
}
.wa-btn:hover { opacity: 0.92; }

/* Grid & Cards */
.grid { display: grid; gap: 16px; margin-bottom: 24px; }
.grid-4 { grid-template-columns: repeat(4, 1fr); }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
.grid-2 { grid-template-columns: repeat(2, 1fr); }
.card {
  background: var(--bg-card); border: 1px solid var(--border-card); border-radius: var(--radius);
  padding: 20px 22px; box-shadow: var(--shadow-sm); position: relative;
}
.card-title { font-size: 14.5px; font-weight: 700; color: var(--text-primary); margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; }
.stat-label { font-size: 11.5px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
.stat-value { font-size: 26px; font-weight: 700; font-family: 'JetBrains Mono', monospace; color: var(--text-primary); }
.stat-value.small { font-size: 19px; }
.stat-value.good { color: var(--signal-cash); }
.stat-value.danger { color: var(--accent-rose); }
.stat-value.amber { color: var(--accent-amber); }
.stat-footer { margin-top: 8px; font-size: 12px; color: var(--text-muted); }

/* Executive Hero Banner (Adapts Light/Dark) */
.hero-earnings {
  background: var(--hero-bg);
  border: 1px solid var(--hero-border); border-radius: var(--radius-lg);
  padding: 28px 32px; color: var(--hero-title-color); margin-bottom: 24px; position: relative; overflow: hidden; box-shadow: var(--shadow-md);
}
.hero-earnings::before {
  content: ""; position: absolute; right: -40px; top: -40px; width: 240px; height: 240px;
  border-radius: 50%; background: radial-gradient(circle, var(--hero-decor-1), transparent 70%); pointer-events: none;
}
.hero-earnings::after {
  content: ""; position: absolute; left: 30%; bottom: -50px; width: 200px; height: 200px;
  border-radius: 50%; background: radial-gradient(circle, var(--hero-decor-2), transparent 70%); pointer-events: none;
}
.hero-label { font-size: 11.5px; color: var(--signal-cash); font-weight: 800; text-transform: uppercase; letter-spacing: 0.8px; display: flex; align-items: center; gap: 8px; }
.hero-value { font-size: 44px; font-weight: 800; color: var(--signal-cash); margin: 6px 0 4px 0; font-family: 'Space Grotesk', sans-serif; text-shadow: 0 0 24px var(--signal-cash-glow); }
.hero-sub { font-size: 13px; color: var(--hero-sub-color); max-width: 650px; }
.hero-stats-row { display: flex; gap: 34px; margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--border-subtle); flex-wrap: wrap; }
.hero-stat-item { font-size: 11.5px; color: var(--hero-stat-text); text-transform: uppercase; letter-spacing: 0.5px; }
.hero-stat-item b { display: block; color: var(--hero-stat-val); font-size: 18px; font-family: 'JetBrains Mono', monospace; margin-top: 4px; font-weight: 700; }

/* Interactive Simulator Widget */
.simulator-box {
  background: var(--bg-card); border: 1px solid var(--border-card); border-radius: var(--radius);
  padding: 18px 22px; margin-bottom: 24px; box-shadow: var(--shadow-sm);
}
.slider-range {
  width: 100%; height: 6px; border-radius: 5px; background: var(--border-subtle);
  outline: none; -webkit-appearance: none; margin: 12px 0 6px 0;
}
.slider-range::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none; width: 18px; height: 18px; border-radius: 50%;
  background: var(--brand); cursor: pointer; box-shadow: 0 0 10px var(--brand-glow);
}

/* Tables */
.table-wrap { background: var(--bg-card); border: 1px solid var(--border-card); border-radius: var(--radius); overflow-x: auto; box-shadow: var(--shadow-sm); margin-bottom: 24px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; }
th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); font-weight: 700; padding: 12px 16px; background: var(--bg-subtle); border-bottom: 1px solid var(--border-subtle); white-space: nowrap; }
td { padding: 13px 16px; border-bottom: 1px solid var(--border-subtle); vertical-align: middle; color: var(--text-primary); }
tr:last-child td { border-bottom: none; }
.row-click { cursor: pointer; transition: background 0.1s ease; }
.row-click:hover td { background: var(--bg-card-hover); }

/* Badges & Pills */
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 99px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; white-space: nowrap; }
.pill-green { background: var(--signal-soft); color: var(--signal-cash); border: 1px solid rgba(16, 185, 129, 0.25); }
.pill-amber { background: var(--accent-amber-soft); color: var(--accent-amber); border: 1px solid rgba(245, 158, 11, 0.25); }
.pill-red { background: var(--accent-rose-soft); color: var(--accent-rose); border: 1px solid rgba(244, 63, 94, 0.25); }
.pill-brand { background: var(--brand-soft); color: var(--brand-light); border: 1px solid rgba(99, 102, 241, 0.25); }
.pill-cyan { background: var(--accent-cyan-soft); color: var(--accent-cyan); border: 1px solid rgba(6, 182, 212, 0.25); }
.pill-gray { background: var(--bg-subtle); color: var(--text-secondary); border: 1px solid var(--border-subtle); }

/* Tabs */
.tabs { display: flex; gap: 4px; margin-bottom: 20px; border-bottom: 1px solid var(--border-subtle); overflow-x: auto; }
.tab { padding: 10px 16px; font-size: 13.5px; font-weight: 600; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all 0.15s ease; white-space: nowrap; user-select: none; }
.tab:hover { color: var(--text-primary); }
.tab.active { color: var(--brand); border-bottom-color: var(--brand); font-weight: 700; }

/* Kanban */
.kanban-board { display: flex; gap: 16px; overflow-x: auto; padding-bottom: 16px; min-height: 520px; }
.kanban-column { flex: 0 0 290px; background: var(--bg-card); border: 1px solid var(--border-card); border-radius: var(--radius); display: flex; flex-direction: column; max-height: 720px; }
.kanban-header { padding: 14px 16px; border-bottom: 1px solid var(--border-subtle); font-size: 13px; font-weight: 700; color: var(--text-primary); display: flex; align-items: center; justify-content: space-between; background: var(--bg-subtle); border-top-left-radius: var(--radius); border-top-right-radius: var(--radius); }
.kanban-cards-wrap { padding: 12px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; flex: 1; }
.kanban-card { background: var(--bg-subtle); border: 1px solid var(--border-subtle); border-radius: 9px; padding: 12px 14px; cursor: pointer; transition: transform 0.1s ease, border-color 0.15s ease; }
.kanban-card:hover { transform: translateY(-2px); border-color: var(--brand); }
.kanban-card-title { font-size: 13px; font-weight: 700; color: var(--text-primary); margin-bottom: 5px; }
.kanban-card-client { font-size: 11.5px; color: var(--brand); margin-bottom: 8px; font-weight: 600; }
.kanban-card-meta { display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: var(--text-muted); margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border-subtle); }

/* Modals */
.overlay { position: fixed; inset: 0; background: var(--overlay-bg); backdrop-filter: blur(8px); display: none; align-items: flex-start; justify-content: center; padding: 50px 16px; z-index: 100; overflow-y: auto; }
.overlay.open { display: flex; }
.modal { background: var(--bg-card); border: 1px solid var(--border-card); border-radius: var(--radius-lg); width: 100%; max-width: 560px; padding: 26px 28px; box-shadow: var(--shadow-lg); position: relative; color: var(--text-primary); }
.modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.modal-title { font-size: 18px; font-weight: 700; color: var(--text-primary); }
.modal-close { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 4px; border-radius: 6px; font-size: 16px; }
.modal-close:hover { color: var(--text-primary); }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 11.5px; font-weight: 700; color: var(--text-secondary); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.4px; }
.field input, .field select, .field textarea { width: 100%; padding: 9px 12px; background: var(--bg-subtle); border: 1px solid var(--border-subtle); border-radius: 8px; font-size: 13.5px; color: var(--text-primary); outline: none; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--border-focus); }
.field-row { display: flex; gap: 12px; }
.field-row .field { flex: 1; }
.modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--border-subtle); }

/* Quick Add */
.quickadd-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 10px; }
.qa-card { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 18px 10px; border-radius: 12px; background: var(--bg-subtle); border: 1px solid var(--border-subtle); cursor: pointer; font-size: 12.5px; font-weight: 700; color: var(--text-primary); transition: all 0.15s ease; user-select: none; }
.qa-card:hover { background: var(--brand-soft); border-color: var(--brand); transform: translateY(-2px); color: var(--brand); }

/* Toast */
#toast { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--toast-bg); border: 1px solid var(--border-card); color: var(--toast-text); padding: 12px 20px; border-radius: 10px; font-size: 13.5px; font-weight: 600; box-shadow: var(--shadow-md); opacity: 0; transition: all 0.22s ease; z-index: 200; pointer-events: none; }
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.notif-dot { position: absolute; top: -4px; right: -4px; background: var(--accent-rose); color: #fff; font-size: 10px; font-weight: 800; padding: 1px 5px; border-radius: 99px; min-width: 17px; text-align: center; }
.empty { padding: 42px 20px; text-align: center; color: var(--text-muted); font-size: 13.5px; }

  const { url, key } = getSupabaseCreds();
  if (url && key && window.supabase && typeof window.supabase.createClient === 'function') {
    try {
      _supabaseClient = window.supabase.createClient(url, key);
      return _supabaseClient;
    } catch (e) {
      console.warn('Supabase init failed', e);
      _supabaseClient = null;
    }
  }
  _supabaseClient = null;
  return null;
}

function isSupabaseConnected() {
  if (!_supabaseClient) initSupabaseClient();
  return !!_supabaseClient;
}

async function testSupabaseConnection() {
  if (!_supabaseClient) initSupabaseClient();
  if (!_supabaseClient) return { success: false, error: 'Missing Supabase URL or Anon Key' };
  try {
    const { data, error } = await _supabaseClient.from('accountix_settings').select('*').limit(1);
    if (error) return { success: false, error: error.message };
    return { success: true, data };
  } catch (err) {
    return { success: false, error: err.message };
  }
}

async function syncFromSupabase() {
  if (!_supabaseClient) initSupabaseClient();
  if (!_supabaseClient || _isSyncingCloud) return;
  _isSyncingCloud = true;

  try {
    const [
      cRes, stRes, pRes, pyRes, eRes, aRes, salRes, tRes, cntRes, lRes, catRes, setRes
    ] = await Promise.all([
      _supabaseClient.from('accountix_clients').select('*'),
      _supabaseClient.from('accountix_staff').select('*'),
      _supabaseClient.from('accountix_packages').select('*'),
      _supabaseClient.from('accountix_payments').select('*'),
      _supabaseClient.from('accountix_expenses').select('*'),
      _supabaseClient.from('accountix_attendance').select('*'),
      _supabaseClient.from('accountix_salary_payments').select('*'),
      _supabaseClient.from('accountix_tasks').select('*'),
      _supabaseClient.from('accountix_content').select('*'),
      _supabaseClient.from('accountix_leads').select('*'),
      _supabaseClient.from('accountix_service_catalog').select('*'),
      _supabaseClient.from('accountix_settings').select('*').limit(1)
    ]);

    if (!cRes.error && cRes.data) {
      STATE.clients = cRes.data.map(c => ({ id: c.id, name: c.name, company: c.company, mobile: c.mobile, whatsapp: c.whatsapp, instagram: c.instagram, status: c.status, createdAt: c.created_at }));
    }
    if (!stRes.error && stRes.data) {
      STATE.staff = stRes.data.map(s => ({ id: s.id, name: s.name, role: s.role, phone: s.phone, baseSalary: Number(s.base_salary) || 0, status: s.status }));
    }
    if (!pRes.error && pRes.data) {
      STATE.packages = pRes.data.map(p => ({ id: p.id, clientId: p.client_id, serviceType: p.service_type, amount: Number(p.amount) || 0, startDate: p.start_date, endDate: p.end_date, assignedStaffId: p.assigned_staff_id, status: p.status }));
    }
    if (!pyRes.error && pyRes.data) {
      STATE.payments = pyRes.data.map(p => ({ id: p.id, clientId: p.client_id, packageId: p.package_id, amount: Number(p.amount) || 0, date: p.date, mode: p.mode, note: p.note }));
    }
    if (!eRes.error && eRes.data) {
      STATE.expenses = eRes.data.map(e => ({ id: e.id, category: e.category, amount: Number(e.amount) || 0, date: e.date, mode: e.mode, note: e.note, staffId: e.staff_id }));
    }
    if (!aRes.error && aRes.data) {
      STATE.attendance = aRes.data.map(a => ({ id: a.id, staffId: a.staff_id, date: a.date, status: a.status, checkIn: a.check_in }));
    }
    if (!salRes.error && salRes.data) {
      STATE.salaryPayments = salRes.data.map(s => ({ id: s.id, staffId: s.staff_id, month: s.month, base: Number(s.base) || 0, incentive: Number(s.incentive) || 0, advance: Number(s.advance) || 0, deduction: Number(s.deduction) || 0, finalPayable: Number(s.final_payable) || 0, paidOn: s.paid_on }));
    }
    if (!tRes.error && tRes.data) {
      STATE.tasks = tRes.data.map(t => ({ id: t.id, title: t.title, clientId: t.client_id, assignedTo: t.assigned_to, deadline: t.deadline, priority: t.priority, status: t.status }));
    }
    if (!cntRes.error && cntRes.data) {
      STATE.contentItems = cntRes.data.map(c => ({ id: c.id, clientId: c.client_id, date: c.date, type: c.type, topic: c.topic, shootById: c.shoot_by_id, assignedStaffId: c.assigned_staff_id, status: c.status, driveLink: c.drive_link, caption: c.caption }));
    }
    if (!lRes.error && lRes.data) {
      STATE.leads = lRes.data.map(l => ({ id: l.id, name: l.name, business: l.business, phone: l.phone, service: l.service, budget: Number(l.budget) || 0, followUpDate: l.follow_up_date, status: l.status, createdAt: l.created_at }));
    }
    if (!catRes.error && catRes.data && catRes.data.length) {
      STATE.serviceCatalog = catRes.data.map(s => ({ id: s.id, name: s.name, defaultAmount: Number(s.default_amount) || 0, cycle: s.cycle, description: s.description }));
    }
    if (!setRes.error && setRes.data && setRes.data.length) {
      const st = setRes.data[0];
      STATE.settings = { agencyName: st.agency_name, tagline: st.tagline, ownerName: st.owner_name, phone: st.phone, email: st.email, currencySymbol: st.currency_symbol, theme: st.theme };
    }

    saveLocalState();
    renderMain();
  } catch (err) {
    console.error('Supabase pull sync error:', err);
  } finally {
    _isSyncingCloud = false;
  }
}

function queueSupabasePush() {
  if (!isSupabaseConnected()) return;
  clearTimeout(_sbSyncTimer);
  _sbSyncTimer = setTimeout(() => {
    pushToSupabaseBulk();
  }, 1200);
}

function saveLocalState() {
  try {
    const { view, _search, _salesTab, _workTab, _teamTab, _moneyTab, _clientTab, _simTargetProfit, _attDate, _reportTab, ...persistable } = STATE;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(persistable));
  } catch (e) { console.error('Save failed', e); }
}

function saveState() {
  saveLocalState();
  queueSupabasePush();
  if (window.AccountiX_API && typeof window.AccountiX_API.syncState === 'function') {
    window.AccountiX_API.syncState(STATE);
  }
}

async function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      Object.assign(STATE, JSON.parse(raw));
      if (!STATE.serviceCatalog || !STATE.serviceCatalog.length) {
        STATE.serviceCatalog = [...DEFAULT_SERVICE_CATALOG];
      }
    } else {
      seedData();
    }
  } catch (e) {
    seedData();
  }
  if (STATE.settings && STATE.settings.theme) {
    document.documentElement.setAttribute('data-theme', STATE.settings.theme);
  }

  // Attempt backend state hydration
  if (window.AccountiX_API && typeof window.AccountiX_API.fetchState === 'function') {
    try {
      const serverState = await window.AccountiX_API.fetchState();
      if (serverState && serverState.allUsers && serverState.allUsers.length) {
        if (serverState.loginLogs) STATE.loginLogs = serverState.loginLogs;
        if (serverState.allUsers) STATE.allUsers = serverState.allUsers;
      }
    } catch(e) {}
  }

  // If Supabase credentials configured, trigger background sync
  if (isSupabaseConnected()) {
    syncFromSupabase();
  }
}

function getServiceCatalog() {
  if (!STATE.serviceCatalog || !STATE.serviceCatalog.length) {
    STATE.serviceCatalog = [...DEFAULT_SERVICE_CATALOG];
  }
  return STATE.serviceCatalog;
}

function getServiceDefaultPrice(serviceName) {
  const catalog = getServiceCatalog();
  const item = catalog.find(s => s.name === serviceName);
  return item ? Number(item.defaultAmount) : 35000;
}

function clientOutstanding(clientId) {
  const pkgs = STATE.packages.filter(p => p.clientId === clientId && p.status !== 'Cancelled');
  const total = pkgs.reduce((sum, p) => sum + (Number(p.amount) || 0), 0);
  const paid = STATE.payments.filter(p => p.clientId === clientId).reduce((sum, p) => sum + (Number(p.amount) || 0), 0);
  return { total, paid, pending: Math.max(0, total - paid) };
}

function activePackage(clientId) {
  const pkgs = STATE.packages.filter(p => p.clientId === clientId && p.status !== 'Cancelled').sort((a, b) => new Date(b.endDate || 0) - new Date(a.endDate || 0));
  return pkgs[0] || null;
}

function inMonth(dateStr, ym) {
  return dateStr && dateStr.slice(0, 7) === ym;
}

function monthStats(ym = currentYM()) {
  const received = STATE.payments.filter(p => inMonth(p.date, ym)).reduce((sum, p) => sum + (Number(p.amount) || 0), 0);
  const expenses = STATE.expenses.filter(e => inMonth(e.date, ym)).reduce((sum, e) => sum + (Number(e.amount) || 0), 0);
  const salaryExpenses = STATE.expenses.filter(e => inMonth(e.date, ym) && e.category === 'Salary').reduce((sum, e) => sum + (Number(e.amount) || 0), 0);
  const profit = received - expenses;
  const revenueBooked = STATE.packages.filter(p => inMonth(p.startDate, ym) && p.status !== 'Cancelled').reduce((sum, p) => sum + (Number(p.amount) || 0), 0);
  const totalOutstanding = STATE.clients.filter(c => c.status !== 'Inactive').reduce((sum, c) => sum + clientOutstanding(c.id).pending, 0);
  return { received, expenses, salaryExpenses, profit, revenueBooked, totalOutstanding };
}

/* ================= MODALS & TOAST ================= */
function toast(msg) {
  const t = document.getElementById('toast');
  if (!t) return;
  t.innerHTML = `<span>⚡</span> ${msg}`;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2400);
}

function showModal(html, width = 540) {
  const overlay = document.getElementById('overlay');
  overlay.innerHTML = `<div class="modal" style="max-width: ${width}px;">${html}</div>`;
  overlay.onclick = (e) => { if (e.target === overlay) closeModal(); };
  overlay.classList.add('open');
}

function closeModal() {
  const overlay = document.getElementById('overlay');
  if (overlay) overlay.classList.remove('open');
}
window.closeModal = closeModal;

/* ================= NAVIGATION HISTORY & BACK ARROW CONTROLLER ================= */
function navigateTo(newView) {
  if (!STATE._history) STATE._history = [];
  if (STATE.view && STATE._history[STATE._history.length - 1] !== STATE.view) {
    STATE._history.push(STATE.view);
  }
  STATE.view = newView;
  STATE._search = '';
  if (STATE._history[STATE._history.length - 1] !== newView) {
    STATE._history.push(newView);
  }
  render();
}
window.navigateTo = navigateTo;

function navigateBack() {
  // 1. If an overlay modal is open, close modal as previous step
  const overlay = document.getElementById('overlay');
  if (overlay && overlay.classList.contains('open')) {
    closeModal();
    return;
  }

  // 2. If searching, clear search and return to current page
  if (STATE._search && STATE._search.trim().length > 0) {
    STATE._search = '';
    render();
    return;
  }

  // 3. Pop from navigation history
  if (STATE._history && STATE._history.length > 1) {
    STATE._history.pop(); // remove current view
    const prevView = STATE._history.pop();
    if (prevView && prevView !== STATE.view) {
      STATE.view = prevView;
      if (!STATE._history) STATE._history = [];
      STATE._history.push(prevView);
      render();
      return;
    }
  }

  // 4. Default fallback based on role
  const role = (STATE.currentUser && STATE.currentUser.role) || 'manager';
  const defaultRoot = role === 'admin' ? 'admin_overview' : role === 'employee' ? 'emp_workspace' : 'dashboard';
  if (STATE.view !== defaultRoot) {
    STATE.view = defaultRoot;
    STATE._history = [defaultRoot];
    render();
  } else {
    toast('Already on primary workspace page');

function buildNotifications() {
  const today = todayStr();
  const notifs = [];
  STATE.packages.forEach(p => {
    if (!p.endDate || p.status === 'Cancelled') return;
    const d = daysBetween(today, p.endDate);
    const c = STATE.clients.find(cl => cl.id === p.clientId);
    if (!c) return;
    if (d < 0) notifs.push({ type: 'Expired Package', text: `${c.name}'s package expired ${Math.abs(d)}d ago`, clientId: c.id, urgent: true });
    else if (d <= 7) notifs.push({ type: 'Renewal Due', text: `${c.name} renews in ${d} days`, clientId: c.id, urgent: true });
  });
  STATE.clients.forEach(c => {
    const out = clientOutstanding(c.id);
    if (out.pending > 0) notifs.push({ type: 'Payment Due', text: `${c.name} has ${fmtMoney(out.pending)} overdue`, clientId: c.id, urgent: true });
  });
  STATE.tasks.forEach(t => {
    if (t.status !== 'Done' && t.deadline && t.deadline < today) notifs.push({ type: 'Task Overdue', text: `"${t.title}" is overdue`, urgent: true });
  });
  return notifs;
}

/* ================= SECURITY & LOGIN AUDIT LOGGER ================= */
function recordLoginAudit(user, authMethod = 'Email & Password (Verified)') {
  if (!STATE.loginLogs) STATE.loginLogs = [];
  const now = new Date();
  const timeStr = now.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }) + ', ' + now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
  
  const logEntry = {
    id: `log_${Date.now()}_${Math.random().toString(36).substr(2, 4)}`,
    userId: user.id || 'usr_guest',
    userName: user.name || 'Anonymous User',
    userEmail: user.email || '—',
    role: user.role || 'manager',
    companyName: user.companyName || STATE.settings.agencyName || 'Primary Workspace',
    loginTime: timeStr,
    authMethod: authMethod,
    status: 'Success (Verified)',
    device: navigator.userAgent.includes('Mobile') ? 'Mobile Device' : 'Desktop Workstation'
  };

  STATE.loginLogs.unshift(logEntry);
  if (user.id) {
    const existing = (STATE.allUsers || []).find(u => u.id === user.id || u.email === user.email);
    if (existing) existing.lastActiveAt = now.toISOString();
  }
  saveState();
}
window.recordLoginAudit = recordLoginAudit;

      // Match user by email

        user = DEMO_PROFILES.find(p => p.email.toLowerCase() === email.toLowerCase());

      // If user not found, create a dynamic profile for the given role
      if (!user) {

    };
  } else {
    const p1 = document.getElementById('auth_reg_pass1');
    const p2 = document.getElementById('auth_reg_pass2');
    const ind = document.getElementById('passMatchIndicator');

    const checkMatch = () => {
      if (!p1.value && !p2.value) {

      } else if (p1.value === p2.value) {
        ind.innerHTML = '⚠️ Passwords match, but minimum 6 characters recommended';

      } else {

        ind.style.color = 'var(--accent-rose)';

    };

    p1.oninput = checkMatch;
    p2.oninput = checkMatch;

    document.getElementById('submitRegBtn').onclick = () => {
      const name = document.getElementById('auth_reg_name').value.trim();
      const email = document.getElementById('auth_reg_email').value.trim();
      const pass1 = p1.value;
      const pass2 = p2.value;

      if (!name || !email || !pass1 || !pass2) {
        toast('Please fill out all fields');
        return;
      }

      if (pass1 !== pass2) {
        toast('⚠️ 2-Time Password verification failed: Passwords do not match!');

        avatar: targetRole === 'admin' ? '👑' : targetRole === 'manager' ? '🏢' : '👥',
        lastActiveAt: new Date().toISOString(),
        status: 'Active',
        purchasedDate: todayStr(),
        plan: targetRole === 'manager' ? 'Pro Agency' : 'Enterprise Suite'

      STATE.allUsers.push(newUser);
      DEMO_PROFILES.push(newUser);
      STATE.currentUser = { ...newUser };

      if (newUser.role === 'admin') STATE.view = 'admin_overview';

function loginGateway(role, targetId, authMethod = '1-Click Portal Authentication') {
  STATE.isAuthenticated = true;
  let loggedUser = null;

  if (role === 'admin') {
    const adminProf = DEMO_PROFILES.find(p => p.role === 'admin') || DEMO_PROFILES[0];
    STATE.currentUser = { ...adminProf };
    STATE.view = 'admin_overview';
    loggedUser = adminProf;
  } else if (role === 'manager') {
    const mgrProf = DEMO_PROFILES.find(p => p.role === 'manager') || DEMO_PROFILES[1];
    STATE.currentUser = { ...mgrProf };
    STATE.view = 'dashboard';
    loggedUser = mgrProf;
  } else if (role === 'employee') {
    const staffRec = (STATE.staff || []).find(s => s.id === targetId) || STATE.staff[0] || { id: 'st_2', name: 'Rohan Mehta', role: 'Lead Video Editor', baseSalary: 32000 };
    
    let prof = DEMO_PROFILES.find(p => p.staffId === staffRec.id || p.name === staffRec.name);
    if (!prof) {
      prof = {
        id: `usr_emp_${staffRec.id}`,
        name: staffRec.name,
        email: `${staffRec.name.toLowerCase().replace(/[^a-z0-9]/g, '')}@accountix.agency`,
        password: 'staff@123',
        role: 'employee',
        staffId: staffRec.id,
        companyId: 'comp_1',
        companyName: STATE.settings.agencyName || 'AccountiX Media HQ',
        title: staffRec.role || 'Creator & Specialist',
        avatar: staffRec.role && (staffRec.role.includes('Shoot') || staffRec.role.includes('Camera')) ? '📹' : '🎬'
      };
      DEMO_PROFILES.push(prof);
    }
    STATE.currentUser = { ...prof };
    STATE.view = 'emp_workspace';
    loggedUser = prof;
  }

  if (loggedUser) {
    recordLoginAudit(loggedUser, authMethod);
  }

  saveState();
  render();
  toast(`Logged in as ${STATE.currentUser.title || STATE.currentUser.name} (${STATE.currentUser.role.toUpperCase()})`);
}
window.loginGateway = loginGateway;

function logoutGateway() {
  STATE.isAuthenticated = false;
  saveState();
  render();
  toast('Signed out to Authentication Gateway');
}
window.logoutGateway = logoutGateway;

async function signInWithGoogle() {
  if (_supabaseClient && _supabaseClient.auth) {
    toast('Redirecting to Google Sign-In...');
    try {
      const { data, error } = await _supabaseClient.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: window.location.href }
      });
      if (error) alert('Google Auth Notice: ' + error.message);
    } catch (e) {
      alert('Google Auth Notice: ' + e.message);
    }
  } else {
    STATE.isAuthenticated = true;
    const mgrProf = (STATE.allUsers || []).find(p => p.role === 'manager') || DEMO_PROFILES[1];
    STATE.currentUser = { ...mgrProf };
    STATE.view = 'dashboard';
    recordLoginAudit(mgrProf, 'Google OAuth 2.0 (Verified)');
    saveState();
    render();
    toast('Google Authentication verified! Signed in as Agency Managing Director.');
  }
}

function exportLoginLogsCsv() {
  const logs = STATE.loginLogs || [];
  if (!logs.length) {
    toast('No login logs to export');
    return;
  }
  const headers = ['ID', 'Timestamp', 'User Name', 'Email', 'Role', 'Company', 'Auth Method', 'Device', 'Status'];
  const rows = logs.map(l => [
    l.id,
    `"${l.loginTime}"`,
    `"${l.userName}"`,
    `"${l.userEmail}"`,
    `"${l.role}"`,
    `"${l.companyName}"`,
    `"${l.authMethod}"`,
    `"${l.device}"`,
    `"${l.status}"`
  ]);
  const csv = [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `AccountiX_Login_Audit_Logs_${todayStr()}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('Login audit logs CSV exported successfully! 📊');
}
window.exportLoginLogsCsv = exportLoginLogsCsv;

function renderTopReceivables() {
  const rows = STATE.clients.map(c => ({ client: c, out: clientOutstanding(c.id) })).filter(r => r.out.pending > 0).sort((a, b) => b.out.pending - a.out.pending).slice(0, 4);

  return `<div style="display:flex; flex-direction:column; gap:8px;">${rows.map(r => `
    <div style="display:flex; justify-content:space-between; align-items:center; padding:10px 12px; background:var(--bg-subtle); border-radius:9px; border:1px solid var(--border-subtle);">
      <div><div style="font-weight:700; font-size:13px; color:var(--text-primary);">${esc(r.client.name)}</div><div style="font-size:11.5px; color:var(--text-muted);">${esc(r.client.company || '—')}</div></div>
      <div style="display:flex; align-items:center; gap:10px;"><div class="mono" style="font-weight:700; color:var(--accent-rose); font-size:13.5px;">${fmtMoney(r.out.pending)}</div><button class="wa-btn" data-dash-remind="${r.client.id}">Remind</button></div>

  if (aCard) {
    aCard.onclick = () => {
      STATE.view = 'team';
      STATE._teamTab = 'attendance';
      render();
    };
  }
  
  const slider = document.getElementById('profitSimSlider');
  if (slider) {
    slider.oninput = (ev) => {
      STATE._simTargetProfit = Number(ev.target.value);
      renderMain();
    };
  }

  document.querySelectorAll('[data-dash-remind]').forEach(el => {
    el.onclick = () => {
      const c = STATE.clients.find(cl => cl.id === el.dataset.dashRemind);
      if (c) { const out = clientOutstanding(c.id); sendWa(c.whatsapp || c.mobile, WA_TEMPLATES.outstanding(c.name, out.pending, null, STATE.settings.agencyName)); }

/* ---------- 2. CLIENTS & PRICING CATALOG ---------- */
function renderClientsView() {
  const currentTab = STATE._clientTab || 'clients';
  const clients = STATE.clients.slice().sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
  const catalog = getServiceCatalog();

  return `
    <div class="view-header" style="display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:24px; flex-wrap:wrap; gap:16px;">
      <div>
        <h1 class="view-title">Clients & Rate Cards</h1>
        <p class="view-sub" style="color:var(--text-secondary);">Client accounts, contracts, renewals and manager pricing tier</p>
      </div>
      <div style="display:flex; gap:8px;">
        <button class="btn btn-ghost" id="clientOpenPricingBtn">🏷️ Package Rate Card</button>
        <button class="btn btn-primary" id="newClientBtn"><span>+</span> Add Client</button>
      </div>
    </div>

    <div class="tabs">
      <div class="tab ${currentTab === 'clients' ? 'active' : ''}" data-cltab="clients">
        <span>🗂️</span> Client Accounts (${clients.length})

}

function renderClientsList(clients) {
  if (!clients.length) {
    return `<div class="card"><div class="empty">No clients onboarded yet. Click "+ Add Client" to begin.</div></div>`;
  }
  return `
    <div class="table-wrap">
      <table>
        <thead><tr><th>Client / Business</th><th>Active Scope</th><th>Assigned Lead</th><th>Total Billed</th><th>Collected</th><th>Pending Dues</th><th>Renewal Date</th><th>Status</th><th></th></tr></thead>
        <tbody>
          ${clients.map(c => {
            const pkg = activePackage(c.id);
            const out = clientOutstanding(c.id);
            const assigned = pkg ? STATE.staff.find(s => s.id === pkg.assignedStaffId) : null;
            return `<tr class="row-click" data-open-client="${c.id}">
              <td><div style="font-weight:700; font-size:13.5px; color:var(--text-primary);">${esc(c.name)}</div><div style="font-size:11.5px; color:var(--text-muted);">${esc(c.company || '')} ${c.mobile ? `· ${c.mobile}` : ''}</div></td>
              <td>${pkg ? esc(pkg.serviceType) : '<span style="color:var(--text-muted)">No package</span>'}</td>
              <td>${assigned ? esc(assigned.name) : '—'}</td>
              <td class="mono font-weight-bold">${fmtMoney(out.total)}</td>
              <td class="mono" style="color:var(--signal-cash);">${fmtMoney(out.paid)}</td>
              <td class="mono" style="color:${out.pending > 0 ? 'var(--accent-rose)' : 'var(--text-muted)'}; font-weight:${out.pending > 0 ? '700' : 'normal'};">${fmtMoney(out.pending)}</td>
              <td>${pkg ? fmtDate(pkg.endDate) : '—'}</td>
              <td><span class="pill ${c.status === 'Inactive' ? 'pill-gray' : 'pill-green'}">${c.status || 'Active'}</span></td>
              <td style="text-align:right;"><button class="btn btn-ghost btn-sm" data-open-client="${c.id}">Ledger</button></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function renderPricingCatalogPanel(catalog) {
  return `
    <div class="card" style="margin-bottom:20px;">
      <div class="card-title">
        <span>🏷️ Manager Service Catalog & Rate Card</span>
        <button class="btn btn-primary btn-sm" id="addNewServiceCatalogBtn">+ Add New Service Package</button>
      </div>
      <p style="font-size:13px; color:var(--text-secondary); margin-bottom:16px;">
        Update the standard rate for any package. Updated rates automatically pre-populate client onboarding, proposals, and multi-package renewals!
      </p>

      <div class="table-wrap" style="margin-bottom:0;">
        <table>
          <thead>
            <tr>
              <th>Service Package</th>
              <th>Billing Frequency</th>
              <th>Standard Rate (₹)</th>
              <th>Scope Deliverables</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody>
            ${catalog.map(s => `

                <td><b>${esc(s.name)}</b></td>
                <td><span class="pill pill-brand">${esc(s.cycle || 'Monthly Retainer')}</span></td>
                <td>
                  <div style="display:flex; align-items:center; gap:6px;">
                    <span class="mono font-weight-bold" style="color:var(--signal-cash); font-size:14px;">${fmtMoney(s.defaultAmount)}</span>
                    <button class="btn btn-ghost btn-sm" data-edit-price="${s.id}" style="padding:3px 8px; font-size:11px;">✏️ Edit Rate</button>

                </td>
                <td style="font-size:12px; color:var(--text-secondary); max-width:320px;">${esc(s.description || '—')}</td>

function attachClients() {
  document.querySelectorAll('[data-cltab]').forEach(el => {
    el.onclick = () => {
      STATE._clientTab = el.dataset.cltab;
      renderMain();
    };
  });

  const n = document.getElementById('newClientBtn');
  if (n) n.onclick = () => openNewClientModal();

  const pBtn = document.getElementById('clientOpenPricingBtn');
  if (pBtn) pBtn.onclick = () => {
    STATE._clientTab = 'pricing';
    renderMain();
  };

  const addCat = document.getElementById('addNewServiceCatalogBtn');
  if (addCat) addCat.onclick = () => openEditServiceCatalogModal();

  document.querySelectorAll('[data-open-client]').forEach(el => {
    el.onclick = () => openClientProfileModal(el.dataset.openClient);
  });

  document.querySelectorAll('[data-edit-price]').forEach(el => {
    el.onclick = () => openEditServiceCatalogModal(el.dataset.editPrice);
  });

  document.querySelectorAll('[data-del-catalog]').forEach(el => {
    el.onclick = () => {
      const sid = el.dataset.delCatalog;
      if (confirm('Remove this service package from the catalog?')) {
        STATE.serviceCatalog = STATE.serviceCatalog.filter(s => s.id !== sid);
        saveState();
        toast('Service package removed');
        renderMain();
      }
    };
  });
}

function openEditServiceCatalogModal(serviceId = null) {
  const catalog = getServiceCatalog();
  const item = serviceId ? catalog.find(s => s.id === serviceId) : {};

  showModal(`
    <div class="modal-header">
      <h3 class="modal-title">${serviceId ? 'Update Package Rate & Details' : 'Add New Service Package'}</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>

    <div class="field">
      <label>Service Package Name *</label>
      <input id="f_sc_name" value="${esc(item.name || '')}" placeholder="e.g. Performance Meta Ads Scaling" required autofocus />
    </div>

    <div class="field-row">
      <div class="field">
        <label>Standard Default Amount (₹) *</label>
        <input type="number" id="f_sc_amount" value="${item.defaultAmount || 40000}" placeholder="40000" required />
      </div>
      <div class="field">
        <label>Billing Frequency</label>
        <select id="f_sc_cycle">
          <option ${item.cycle === 'Monthly Retainer' ? 'selected' : ''}>Monthly Retainer</option>
          <option ${item.cycle === 'Project-Based' ? 'selected' : ''}>Project-Based</option>
          <option ${item.cycle === 'One-Time' ? 'selected' : ''}>One-Time</option>
          <option ${item.cycle === 'Quarterly Retainer' ? 'selected' : ''}>Quarterly Retainer</option>
        </select>
      </div>
    </div>

    <div class="field">
      <label>Deliverable Scope & Features Summary</label>
      <textarea id="f_sc_desc" rows="2" placeholder="e.g. 12 Reels, Ad creative variations, A/B copy testing, weekly analytics call">${esc(item.description || '')}</textarea>
    </div>

    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" id="saveServiceCatalogBtn">Save Package Rate</button>
    </div>
  `, 540);

  document.getElementById('saveServiceCatalogBtn').onclick = () => {
    const name = document.getElementById('f_sc_name').value.trim();
    const amount = Number(document.getElementById('f_sc_amount').value);
    const cycle = document.getElementById('f_sc_cycle').value;
    const desc = document.getElementById('f_sc_desc').value.trim();

    if (!name || !amount) {
      toast('Service name and rate are required');
      return;
    }

    if (serviceId) {
      const s = STATE.serviceCatalog.find(i => i.id === serviceId);
      if (s) {
        s.name = name;
        s.defaultAmount = amount;
        s.cycle = cycle;
        s.description = desc;
      }
    } else {
      STATE.serviceCatalog.push({
        id: uid('srv'),
        name,
        defaultAmount: amount,
        cycle,
        description: desc
      });
    }

    saveState();
    closeModal();
    toast('Package rate card updated');
    renderMain();
  };
}

function openPricingCatalogModal() {
  STATE._clientTab = 'pricing';
  STATE.view = 'clients';
  render();
}

function openNewClientModal(prefill = {}) {
  const catalog = getServiceCatalog();
  const defaultService = prefill.service || catalog[0].name;
  const defaultAmount = prefill.budget || getServiceDefaultPrice(defaultService);

  showModal(`
    <div class="modal-header"><h3 class="modal-title">New Client Onboarding</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="field"><label>Client Name *</label><input id="f_cl_name" value="${esc(prefill.name || '')}" placeholder="e.g. UrbanFit Sports" required autofocus /></div>
    <div class="field-row">
      <div class="field"><label>Company</label><input id="f_cl_company" value="${esc(prefill.business || '')}" /></div>
      <div class="field"><label>Mobile</label><input id="f_cl_mobile" value="${esc(prefill.phone || '')}" /></div>
    </div>
    <div class="field-row">
      <div class="field"><label>WhatsApp</label><input id="f_cl_wa" value="${esc(prefill.phone || '')}" /></div>
      <div class="field"><label>Instagram</label><input id="f_cl_insta" placeholder="@handle" /></div>
    </div>
    <div class="field">
      <label>Service Package (Manager Catalog)</label>
      <select id="f_cl_service">
        ${catalog.map(s => `<option value="${esc(s.name)}" data-price="${s.defaultAmount}" ${s.name === defaultService ? 'selected' : ''}>${esc(s.name)} (${fmtMoney(s.defaultAmount)})</option>`).join('')}
      </select>
    </div>
    <div class="field-row">
      <div class="field"><label>Start Date</label><input type="date" id="f_cl_start" value="${todayStr()}" /></div>
      <div class="field"><label>End Date</label><input type="date" id="f_cl_end" value="${addMonths(todayStr(), 1)}" /></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Package Amount (₹)</label><input type="number" id="f_cl_amount" value="${defaultAmount}" /></div>
      <div class="field"><label>Advance Received (₹)</label><input type="number" id="f_cl_received" value="0" /></div>
    </div>
    <div class="field"><label>Assigned Lead / Specialist</label><select id="f_cl_staff"><option value="">— None —</option>${STATE.staff.map(s => `<option value="${s.id}">${esc(s.name)} (${esc(s.role)})</option>`).join('')}</select></div>
    <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" id="saveClBtn">Save Client</button></div>
  `, 560);

  const servSel = document.getElementById('f_cl_service');
  if (servSel) {
    servSel.onchange = (e) => {
      const selected = servSel.options[servSel.selectedIndex];
      const pr = selected.dataset.price;
      if (pr) document.getElementById('f_cl_amount').value = pr;
    };
  }

  document.getElementById('saveClBtn').onclick = () => {
    const name = document.getElementById('f_cl_name').value.trim();
    if (!name) { toast('Client name required'); return; }
    const cid = uid('cl');
    STATE.clients.push({ id: cid, name, company: document.getElementById('f_cl_company').value.trim(), mobile: document.getElementById('f_cl_mobile').value.trim(), whatsapp: document.getElementById('f_cl_wa').value.trim(), instagram: document.getElementById('f_cl_insta').value.trim(), status: 'Active', createdAt: new Date().toISOString() });
    const amount = Number(document.getElementById('f_cl_amount').value) || 0;
    const pkgId = uid('pkg');
    STATE.packages.push({ id: pkgId, clientId: cid, serviceType: document.getElementById('f_cl_service').value, amount, startDate: document.getElementById('f_cl_start').value, endDate: document.getElementById('f_cl_end').value, assignedStaffId: document.getElementById('f_cl_staff').value, status: 'Active' });
    const rec = Number(document.getElementById('f_cl_received').value) || 0;
    if (rec > 0) { STATE.payments.push({ id: uid('pay'), clientId: cid, packageId: pkgId, amount: rec, date: todayStr(), mode: 'UPI (GPay / PhonePe / Paytm)', note: 'Advance full/part payment' }); }
    saveState(); closeModal(); toast('Client onboarded successfully'); render();
  };
}

function openClientProfileModal(clientId) {

  if (!c) return;
  const pkgs = STATE.packages.filter(p => p.clientId === clientId).sort((a, b) => new Date(b.startDate || 0) - new Date(a.startDate || 0));

  showModal(`

    <div class="grid grid-3" style="margin-bottom:16px;">

      <table><thead><tr><th>Date</th><th>Mode</th><th>Amount</th><th>Receipt</th></tr></thead>
      <tbody>${pays.map(p => `<tr><td>${fmtDate(p.date)}</td><td>${esc(p.mode || 'Cash')}</td><td class="mono" style="color:var(--signal-cash);">${fmtMoney(p.amount)}</td><td><button class="wa-btn btn-sm" data-wa-pay="${p.id}">WA Receipt</button></td></tr>`).join('') || `<tr><td colspan="4" class="empty">No payments received yet.</td></tr>`}</tbody></table>
    </div>

    el.onclick = () => {
      const p = STATE.payments.find(p => p.id === el.dataset.waPay);
      if (p) sendWa(c.whatsapp || c.mobile, WA_TEMPLATES.paymentThanks(c.name, p.amount, p.date, clientOutstanding(clientId).pending, STATE.settings.agencyName));
    };
  });
}

/* ================= MULTI-PACKAGE RENEWAL WORKFLOW ================= */
let activeRenewRows = [];

function openMultiRenewModal(clientId) {
  const client = STATE.clients.find(c => c.id === clientId);
  if (!client) return;

  const catalog = getServiceCatalog();
  const last = activePackage(clientId);

  activeRenewRows = [
    {
      id: uid('rnrow'),
      serviceType: last ? last.serviceType : catalog[0].name,
      amount: last ? last.amount : getServiceDefaultPrice(catalog[0].name),
      startDate: todayStr(),
      endDate: addMonths(todayStr(), 1),
      assignedStaffId: last ? last.assignedStaffId : ''
    }
  ];

  renderMultiRenewModalContent(clientId);
}

function renderMultiRenewModalContent(clientId) {
  const client = STATE.clients.find(c => c.id === clientId);
  const catalog = getServiceCatalog();
  const totalRenewSum = activeRenewRows.reduce((s, r) => s + (Number(r.amount) || 0), 0);
  const earliestEnd = activeRenewRows[0] ? activeRenewRows[0].endDate : addMonths(todayStr(), 1);

  showModal(`
    <div class="modal-header">
      <div>
        <h3 class="modal-title">Renew & Add Packages — ${esc(client.name)}</h3>
        <div style="font-size:12px; color:var(--text-muted);">Add single or multiple service packages for the next billing cycle</div>
      </div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>

    <div class="card" style="background:var(--brand-soft); border-color:var(--brand); margin-bottom:14px;">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <div>
          <div style="font-size:12px; font-weight:700; color:var(--brand);">Combined Renewal Amount</div>
          <div class="mono" style="font-size:22px; font-weight:800; color:var(--signal-cash);">${fmtMoney(totalRenewSum)}</div>
        </div>
        <button class="wa-btn btn-sm" id="sendMultiRenewWaBtn">
          Send WhatsApp Renewal Notice (${activeRenewRows.length} Services)
        </button>
      </div>
    </div>

    <div id="renewRowsList" style="display:flex; flex-direction:column; gap:12px; max-height:360px; overflow-y:auto; padding-right:4px;">
      ${activeRenewRows.map((row, idx) => `
        <div class="card" style="padding:14px 16px; background:var(--bg-subtle); border:1px solid var(--border-card);" data-row-idx="${idx}">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <div style="font-size:12px; font-weight:700; color:var(--brand); text-transform:uppercase;">
              Package #${idx + 1}
            </div>
            ${activeRenewRows.length > 1 ? `
              <button class="btn btn-danger-ghost btn-sm" style="padding:2px 8px; font-size:11px;" onclick="removeRenewRow(${idx}, '${clientId}')">
                Remove ✕
              </button>
            ` : ''}
          </div>

          <div class="field" style="margin-bottom:8px;">
            <label style="font-size:11px;">Service Package (Catalog)</label>
            <select class="renew-service-select" data-row-field="serviceType" data-idx="${idx}" style="font-size:12.5px; padding:7px 10px;">
              ${catalog.map(s => `
                <option value="${esc(s.name)}" data-default="${s.defaultAmount}" ${s.name === row.serviceType ? 'selected' : ''}>
                  ${esc(s.name)} — Standard: ${fmtMoney(s.defaultAmount)}
                </option>
              `).join('')}
            </select>
          </div>

          <div class="field-row" style="margin-bottom:8px;">
            <div class="field" style="margin-bottom:0;">
              <label style="font-size:11px;">Amount (₹)</label>
              <input type="number" class="renew-input" data-row-field="amount" data-idx="${idx}" value="${row.amount}" style="font-size:12.5px; padding:7px 10px;" />
            </div>
            <div class="field" style="margin-bottom:0;">
              <label style="font-size:11px;">Assigned Specialist</label>
              <select class="renew-input" data-row-field="assignedStaffId" data-idx="${idx}" style="font-size:12.5px; padding:7px 10px;">
                <option value="">— Unassigned —</option>
                ${STATE.staff.map(st => `
                  <option value="${st.id}" ${st.id === row.assignedStaffId ? 'selected' : ''}>${esc(st.name)}</option>
                `).join('')}
              </select>
            </div>
          </div>

          <div class="field-row">
            <div class="field" style="margin-bottom:0;">
              <label style="font-size:11px;">Cycle Start</label>
              <input type="date" class="renew-input" data-row-field="startDate" data-idx="${idx}" value="${row.startDate}" style="font-size:12.5px; padding:7px 10px;" />
            </div>
            <div class="field" style="margin-bottom:0;">
              <label style="font-size:11px;">Cycle End</label>
              <input type="date" class="renew-input" data-row-field="endDate" data-idx="${idx}" value="${row.endDate}" style="font-size:12.5px; padding:7px 10px;" />
            </div>
          </div>
        </div>
      `).join('')}
    </div>

    <div style="margin-top:10px;">
      <button class="btn btn-ghost btn-sm" style="width:100%; border-style:dashed;" onclick="addRenewRow('${clientId}')">
        ➕ Add Another Service / Package
      </button>
    </div>

    <div class="field-row" style="margin-top:14px; padding-top:12px; border-top:1px solid var(--border-subtle);">
      <div class="field" style="margin-bottom:0;">
        <label>Payment Received Now (₹)</label>
        <input type="number" id="f_rn_rec_pay" value="0" placeholder="0" />
      </div>
      <div class="field" style="margin-bottom:0;">
        <label>Payment Mode</label>
        <select id="f_rn_rec_mode">
          ${PAYMENT_MODES.map(m => `<option>${m}</option>`).join('')}
        </select>
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" id="confirmSaveMultiRenewBtn">
        Confirm & Save ${activeRenewRows.length} Package(s)
      </button>
    </div>
  `, 640);

  document.querySelectorAll('.renew-service-select').forEach(el => {
    el.onchange = (e) => {
      const idx = Number(el.dataset.idx);
      const selected = el.options[el.selectedIndex];
      const defPrice = Number(selected.dataset.default) || 35000;
      activeRenewRows[idx].serviceType = el.value;
      activeRenewRows[idx].amount = defPrice;
      renderMultiRenewModalContent(clientId);
    };
  });

  document.querySelectorAll('.renew-input').forEach(el => {
    el.oninput = () => {
      const idx = Number(el.dataset.idx);
      const field = el.dataset.rowField;
      activeRenewRows[idx][field] = field === 'amount' ? (Number(el.value) || 0) : el.value;
    };
  });

  const waBtn = document.getElementById('sendMultiRenewWaBtn');
  if (waBtn && client) {
    waBtn.onclick = () => {
      const msg = WA_TEMPLATES.multiRenewal(client.name, activeRenewRows, totalRenewSum, earliestEnd, STATE.settings.agencyName);
      sendWa(client.whatsapp || client.mobile, msg);
    };
  }

  document.getElementById('confirmSaveMultiRenewBtn').onclick = () => {
    if (!activeRenewRows.length) {
      toast('At least one package is required');
      return;
    }

    activeRenewRows.forEach(row => {
      STATE.packages.push({
        id: uid('pkg'),
        clientId,
        serviceType: row.serviceType,
        amount: Number(row.amount) || 0,
        startDate: row.startDate,
        endDate: row.endDate,
        assignedStaffId: row.assignedStaffId || '',
        status: 'Active'
      });
    });

    const recPay = Number(document.getElementById('f_rn_rec_pay').value) || 0;
    if (recPay > 0) {
      STATE.payments.push({
        id: uid('pay'),
        clientId,
        amount: recPay,
        date: todayStr(),
        mode: document.getElementById('f_rn_rec_mode').value,
        note: `Renewal advance payment (${activeRenewRows.length} services)`
      });
    }

    saveState();
    closeModal();
    toast(`Saved ${activeRenewRows.length} package(s) totaling ${fmtMoney(totalRenewSum)}`);
    render();
  };
}

window.addRenewRow = (clientId) => {
  const catalog = getServiceCatalog();
  activeRenewRows.push({
    id: uid('rnrow'),
    serviceType: catalog[0].name,
    amount: catalog[0].defaultAmount,
    startDate: todayStr(),
    endDate: addMonths(todayStr(), 1),
    assignedStaffId: ''
  });
  renderMultiRenewModalContent(clientId);
};

window.removeRenewRow = (idx, clientId) => {
  activeRenewRows.splice(idx, 1);
  renderMultiRenewModalContent(clientId);
};

/* ---------- 3. CONTENT STUDIO ---------- */
function renderContentView() {

    { status: 'Idea', label: '💡 Ideas & Scripts' },
    { status: 'Shoot Assigned', label: '🎥 Shoot Scheduled' },
    { status: 'Editing', label: '✂️ Post-Production / Editing' },
    { status: 'Client Approval', label: '⏳ Client Approval' },
    { status: 'Uploaded/Posted', label: '🚀 Published' }

  return `
    <div class="view-header" style="display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:24px; flex-wrap:wrap; gap:16px;">
      <div><h1 class="view-title">Creative Studio & Content Pipeline</h1><p class="view-sub" style="color:var(--text-secondary);">${items.length} deliverables in creative workflow</p></div>
      <button class="btn btn-primary" id="newCntBtn"><span>+</span> Add Content / Shoot</button>
    </div>

    </div>
    ${currentTab === 'kanban' ? `
      <div class="kanban-board">
        ${columns.map(col => {
          const colItems = items.filter(it => {
            if (col.status === 'Shoot Assigned') return it.status === 'Shoot Assigned' || it.status === 'Shoot Done';
            if (col.status === 'Editing') return it.status === 'Editing' || it.status === 'Edit Done';
            if (col.status === 'Client Approval') return it.status === 'Client Approval' || it.status === 'Approved';
            return it.status === col.status;
          });
          return `<div class="kanban-column">
            <div class="kanban-header"><span>${col.label}</span><span class="nav-counter">${colItems.length}</span></div>
            <div class="kanban-cards-wrap">${colItems.map(it => {
              const client = STATE.clients.find(c => c.id === it.clientId);
              const shooter = STATE.staff.find(s => s.id === it.shootById);
              const editor = STATE.staff.find(s => s.id === it.assignedStaffId);
              return `<div class="kanban-card" data-edit-cnt="${it.id}">
                <div class="kanban-card-title">${esc(it.topic || it.type)}</div>
                <div class="kanban-card-client">${esc(client ? client.name : 'No client')}</div>
                <div style="display:flex; gap:4px; margin-bottom:6px;"><span class="pill pill-gray" style="font-size:10px;">${it.type}</span><span class="pill pill-brand" style="font-size:10px;">${it.status}</span></div>
                <div class="kanban-card-meta"><span>📅 ${fmtDate(it.date)}</span><span>${shooter ? `🎥 ${esc(shooter.name.split(' ')[0])}` : ''} ${editor ? `✂️ ${esc(editor.name.split(' ')[0])}` : ''}</span></div>
                ${it.status === 'Client Approval' && client ? `<button class="wa-btn btn-sm" style="width:100%; justify-content:center; margin-top:8px;" data-wa-appr="${it.id}">WhatsApp Approval</button>` : ''}
              </div>`;
            }).join('') || `<div class="empty" style="padding:20px 0; font-size:12px;">No items</div>`}</div>
          </div>`;
        }).join('')}
      </div>
    ` : `
      <div class="table-wrap">
        <table>
          <thead><tr><th>Client</th><th>Date</th><th>Type</th><th>Topic / Hook</th><th>Videographer</th><th>Editor</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody>
            ${items.map(it => {
              const client = STATE.clients.find(c => c.id === it.clientId);
              const shooter = STATE.staff.find(s => s.id === it.shootById);
              const editor = STATE.staff.find(s => s.id === it.assignedStaffId);
              return `<tr>
                <td><b>${esc(client ? client.name : '—')}</b></td>
                <td>${fmtDate(it.date)}</td>
                <td><span class="pill pill-gray">${it.type}</span></td>
                <td><b>${esc(it.topic || '—')}</b></td>
                <td>${shooter ? esc(shooter.name) : '—'}</td>
                <td>${editor ? esc(editor.name) : '—'}</td>
                <td><select data-cnt-status="${it.id}" style="padding:5px; font-size:12px; border-radius:6px;">${CONTENT_STATUSES.map(s => `<option ${s === it.status ? 'selected' : ''}>${s}</option>`).join('')}</select></td>
                <td><div style="display:flex; gap:6px;">${it.driveLink ? `<a href="${it.driveLink}" target="_blank" class="btn btn-ghost btn-sm">📁 Link</a>` : ''} ${client ? `<button class="wa-btn btn-sm" data-wa-appr="${it.id}">WA Approval</button>` : ''} <button class="btn btn-ghost btn-sm" data-edit-cnt="${it.id}">Edit</button></div></td>
              </tr>`;

          </tbody>
        </table>
      </div>

}
function attachContent() {
  document.querySelectorAll('[data-ctab]').forEach(el => el.onclick = () => { STATE._workTab = el.dataset.ctab; renderMain(); });
  const n = document.getElementById('newCntBtn'); if (n) n.onclick = () => openContentModal();
  document.querySelectorAll('[data-edit-cnt]').forEach(el => el.onclick = (e) => { if (!e.target.closest('button') && !e.target.closest('select')) openContentModal(el.dataset.editCnt); });
  document.querySelectorAll('[data-cnt-status]').forEach(el => el.onchange = () => {
    const it = STATE.contentItems.find(i => i.id === el.dataset.cntStatus);
    if (it) { it.status = el.value; saveState(); toast('Status updated'); renderMain(); }
  });
  document.querySelectorAll('[data-wa-appr]').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      const it = STATE.contentItems.find(i => i.id === el.dataset.waAppr);
      if (!it) return;
      const c = STATE.clients.find(cl => cl.id === it.clientId);
      if (c) sendWa(c.whatsapp || c.mobile, WA_TEMPLATES.approval(c.name, it.type, it.topic, it.driveLink, STATE.settings.agencyName));
    };
  });
}

  showModal(`

function renderTeamView() {

          </tr>`).join('')}</tbody>
        </table>
      </div>
    ` : currentTab === 'attendance' ? `
      <!-- Daily Punch Station & Controls -->
      <div class="card" style="margin-bottom:20px;">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:16px;">

              <span>🕒 Daily Attendance Roll Call</span>
            </div>
            <div style="font-size:12px; color:var(--text-secondary);">

            </div>
          </div>
          <div style="display:flex; align-items:center; gap:10px;">
            <input type="date" id="attDatePick" value="${selectedDate}" style="padding:6px 12px; font-size:12.5px; border-radius:8px; border:1px solid var(--border-subtle); background:var(--bg-subtle); color:var(--text-primary);" />

          </div>
        </div>

            <tbody>${staff.map(s => {
              const rec = STATE.attendance.find(a => a.staffId === s.id && a.date === selectedDate);

          </table>
        </div>
      </div>

      <!-- Monthly Full Timesheet Sheet Matrix (Calendar View) -->
      <div class="card">
        <div class="card-title">
          <span>📅 Monthly Attendance Timesheet Matrix (${fmtMonthYear(ym)})</span>
          <span style="font-size:11.5px; color:var(--text-muted); font-weight:normal;">Legend: <span class="pill pill-green" style="font-size:9px; padding:1px 5px;">P</span> Present · <span class="pill pill-amber" style="font-size:9px; padding:1px 5px;">½</span> Half Day · <span class="pill pill-red" style="font-size:9px; padding:1px 5px;">A</span> Absent</span>
        </div>
        
        <div class="table-wrap" style="margin-bottom:0; max-height:480px; overflow-x:auto;">
          <table>
            <thead>
              <tr>
                <th style="position:sticky; left:0; background:var(--bg-subtle); z-index:2; min-width:140px;">Team Member</th>
                ${Array.from({ length: daysInMonth }, (_, i) => i + 1).map(d => `<th style="text-align:center; padding:8px 6px; font-size:10px; min-width:32px;">${d}</th>`).join('')}
                <th style="text-align:center; min-width:60px;">Present</th>
                <th style="text-align:center; min-width:60px;">Half Days</th>
                <th style="text-align:center; min-width:60px;">Rate</th>
              </tr>
            </thead>
            <tbody>
              ${staff.map(s => {
                let pCount = 0, hCount = 0, aCount = 0;
                const dayCells = Array.from({ length: daysInMonth }, (_, i) => {
                  const dNum = String(i + 1).padStart(2, '0');
                  const dtStr = `${ym}-${dNum}`;
                  const rec = STATE.attendance.find(a => a.staffId === s.id && a.date === dtStr);
                  const st = rec ? rec.status : '';
                  if (st === 'Present') pCount++;
                  else if (st === 'Half Day') hCount++;
                  else if (st === 'Absent') aCount++;

                  let badge = '<span style="color:var(--text-faint); font-size:11px;">·</span>';
                  if (st === 'Present') badge = '<span class="pill pill-green" style="padding:1px 5px; font-size:10px;">P</span>';
                  else if (st === 'Half Day') badge = '<span class="pill pill-amber" style="padding:1px 4px; font-size:10px;">½</span>';
                  else if (st === 'Absent') badge = '<span class="pill pill-red" style="padding:1px 5px; font-size:10px;">A</span>';

                  return `<td style="text-align:center; padding:6px 2px; cursor:pointer;" data-toggle-cell="${s.id}_${dtStr}" title="${esc(s.name)} on ${dtStr}: ${st || 'Unmarked'} (Click to toggle)">${badge}</td>`;
                }).join('');

                const effectivePresent = pCount + (hCount * 0.5);
                const totalMarked = pCount + hCount + aCount;
                const attRate = totalMarked > 0 ? Math.round((effectivePresent / totalMarked) * 100) : 100;

                return `
                  <tr>
                    <td style="position:sticky; left:0; background:var(--bg-card); z-index:1; font-weight:700;">
                      <div>${esc(s.name)}</div>
                      <div style="font-size:10.5px; color:var(--text-muted); font-weight:normal;">${esc(s.role || '')}</div>
                    </td>
